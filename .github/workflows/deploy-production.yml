        #   echo "Translations synced: ${DATE}.json" >> $GITHUB_OUTPUT
        #   echo "${DELIMITER}" >> $GITHUB_OUTPUT

      - name: Determine final status
        if: ${{ !failure() }}
        id: final_status
        run: |
          MIGRATIONS_STATUS="${{ steps.migrations.outcome }}"
          CONFIG_STATUS="${{ steps.config.outcome }}"
          VALIDATIONS_STATUS="${{ steps.validations.outcome }}"
          SYNC_TRANSLATIONS_STATUS="${{ steps.sync_translations.outcome }}"

          if [ "$MIGRATIONS_STATUS" == "success" ] && [ "$CONFIG_STATUS" == "success" ] && [ "$VALIDATIONS_STATUS" == "success" ] && [ "$SYNC_TRANSLATIONS_STATUS" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=completed-with-warnings" >> $GITHUB_OUTPUT
          fi

      - name: Send final status to Slack
        if: ${{ !failure() }}
        uses: ./.github/actions/slack-notify
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ steps.final_status.outputs.status }}
          environment: production
          release-tag: ${{ steps.release_info.outputs.tag }}
          release-url: ${{ github.event.release.html_url }}
          migrations-status: ${{ steps.migrations.outcome }}
          config-status: ${{ steps.config.outcome }}
          pull-validations-status: skipped
          validations-status: ${{ steps.validations.outcome }}
          sync-translations-status: ${{ steps.sync_translations.outcome }}
          validation-sheet-id: ${{ secrets.VALIDATION_SHEET_ID }}

      - name: Send deployment failure notification to Slack
        if: failure()
        uses: ./.github/actions/slack-notify
