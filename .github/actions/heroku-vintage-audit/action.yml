name: 'Audit Program Vintages'
description: 'Reports programs whose FPL edition disagrees with programs/vintage.py (report-only)'

inputs:
  heroku-api-key:
    description: 'Heroku API key'
    required: true
  heroku-app-name:
    description: 'Heroku application name'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Audit program vintages
      shell: bash
      env:
        HEROKU_API_KEY: ${{ inputs.heroku-api-key }}
      run: |
        # Reports programs whose configured FPL edition disagrees with the intent recorded
        # in programs/vintage.py, have no year set, or have no recorded intent at all. A
        # unit test cannot do this: 72 of the rows found behind an edition have no config
        # JSON, so the database is the only place their edition exists.
        #
        # Report-only for now (no --check, `|| true`). Pre-existing drift would otherwise
        # block every unrelated deploy, and most rows are still unresearched. Once the
        # classification is finished this becomes `--check` and the step fails.
        #
        # Runs after the release phase, not in it: it only reports, so nothing waits on it.
        echo "Auditing program vintages..."
        heroku run --exit-code -a ${{ inputs.heroku-app-name }} \
          "python manage.py audit_program_vintage --ignore-unmapped" 2>&1 || true
