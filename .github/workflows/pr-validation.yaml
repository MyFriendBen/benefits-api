name: PR Validation

# Validates pull requests to main branch with:
# - Full test suite using VCR in strict playback (cassettes only, never records),
#   split across parallel jobs so the run takes minutes instead of a quarter hour
# - Coverage upload to Codecov (same-repo PRs only; fork PRs skip upload — no secrets)
# - Code formatting checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Picks the one set of test durations every group of this run splits the suite by.
  # Each group resolving its own could not be trusted to agree: a staging deploy saving
  # a newer entry between their restores, a re-run of one failed group after a merge, or
  # one failed restore would hand the groups different files, and pytest-split would
  # then cut the suite at different places -- some tests in two groups, some in none,
  # and every group still green. Resolved here once, the file reaches every group as an
  # artifact, which a re-run of failed groups reuses from the original attempt.
  test-durations:
    name: Resolve test durations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The newest entry the staging deploy saved (run-tests' store-durations). The key
      # never matches -- it only has to be unique -- so restore-keys picks the newest
      # entry; PR runs can read entries saved on main.
      - name: Restore the latest recorded durations
        id: restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .test_durations
          key: test-durations-${{ github.sha }}
          restore-keys: test-durations-

      # Nothing cached yet, or the restore failed: an empty record makes pytest-split
      # divide the tests evenly by count. Less balanced, but the same in every group.
      - name: Fall back to an even split
        env:
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          if [ -s .test_durations ]; then
            echo "Using durations from cache entry $MATCHED_KEY"
          else
            echo "No recorded durations, so the groups will split evenly by test count"
            echo '{}' > .test_durations
          fi
          echo "Test durations: sha256 $(sha256sum .test_durations | cut -d' ' -f1)"

      - name: Hand the durations to the test groups
        uses: actions/upload-artifact@v7
        with:
          name: test-durations
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test:
    name: Run Tests with Coverage (${{ matrix.group }}/${{ matrix.splits }})
    needs: test-durations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One job per group of the suite, balanced by the durations resolved above (see
    # docs/TESTING.md). Each job still fans out across the runner's cores with xdist.
    # Changing the number of groups means changing splits, group, and codecov.yml's
    # after_n_builds together.
    strategy:
      # Let every group finish, so a PR shows all its failures in one run rather than
      # only those in whichever group failed first.
      fail-fast: false
      matrix:
        splits: [3]
        group: [1, 2, 3]

    env:
      SECRET_KEY: django-insecure-test-key-ci-github-actions-only
      DJANGO_SETTINGS_MODULE: benefits.settings
      DB_NAME: test_benefits_db
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      ENABLE_GOOGLE_INTEGRATIONS: false
      # Without this, settings.py takes the LocMemCache branch and the entire
      # django_redis path -- serialization, compression, key handling, connection
      # pooling -- goes untested. That gap is how a Redis config error reached
      # staging with a green build.
      REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_benefits_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_benefits_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # No continue-on-error: a group that can't get the shared file must fail rather
      # than split the suite some other way.
      - name: Download the test durations
        uses: actions/download-artifact@v8
        with:
          name: test-durations
          path: .

      - name: Run tests with VCR and upload coverage
        uses: ./.github/actions/run-tests
        with:
          # Strict playback. A request with no matching cassette fails the build
          # instead of being recorded live, so a PR can never go green by reaching
          # a real API -- and no fork PR needs credentials to pass.
          vcr-mode: none
          # Secrets (incl. CODECOV_TOKEN) are not available to workflows on fork PRs.
          # Still run the full suite; upload coverage only for same-repo PRs.
          # Codecov merges the groups' uploads for a commit (see codecov.yml).
          upload-coverage: ${{ !github.event.pull_request.head.repo.fork && 'true' || 'false' }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          hud-api-token: ${{ secrets.HUD_API_TOKEN }}
          splits: ${{ matrix.splits }}
          group: ${{ matrix.group }}
          # Checking that migrations apply and the system checks pass needs doing once
          # per run, not once per group.
          run-django-checks: ${{ matrix.group == 1 }}

  # A single check that passes only when every group passed. It keeps the name the
  # unsplit job had, so anything that waits on "Run Tests with Coverage" -- a required
  # status check, a merge queue -- keeps working whatever the number of groups. It runs
  # when a group failed or was skipped, so those fail it, but not when the run was
  # cancelled, so a cancellation isn't reported as a test failure.
  tests-passed:
    name: Run Tests with Coverage
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every test group passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "At least one test group did not pass (result: $RESULT)"
            exit 1
          fi
          echo "Every test group passed"

  lint:
    name: Check Formatting
    uses: ./.github/workflows/format.yaml
