name: 'Audit Federal Programs'
description: 'Fails if any program is active under both the federal white label and another one'

inputs:
  heroku-api-key:
    description: 'Heroku API key'
    required: true
  heroku-app-name:
    description: 'Heroku application name'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Audit federal programs
      shell: bash
      env:
        HEROKU_API_KEY: ${{ inputs.heroku-api-key }}
      run: |
        # Federal programs are shown to every white label, and moving one to `federal`
        # deactivates its state rows in a data migration. A name still active on both sides is a
        # configuration error the results page only logs, so this marks the deploy failed and
        # sends the failure notification.
        #
        # It is an alarm, not a gate: by the time it runs the new code and migrations are live.
        # The gates are earlier -- the PR-time test over the committed configs and the
        # import_program_config guard. It runs last so a failure can't skip the config or
        # validation steps of an otherwise healthy deploy.
        echo "Auditing federal programs..."
        heroku run --exit-code -a ${{ inputs.heroku-app-name }} "python manage.py audit_federal_programs" 2>&1
